[package]
name = "skani"
resolver = "2"
###Make sure to change version in main.rs after changing cargo.toml
version = "0.3.2"
####
edition = "2021"
license = "MIT OR Apache-2.0"
description = "skani is a fast tool for calculating ANI between metagenomic sequences, such as metagenome-assembled genomes (MAGs). It is extremely fast and is robust against incompleteness and fragmentation, giving accurate ANI estimates."
homepage = "https://github.com/bluenote-1577/skani"
documentation = "https://github.com/bluenote-1577/skani"
repository = "https://github.com/bluenote-1577/skani"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

exclude = [
    "test_files/*",
    "videos/*",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "1.0"
bio = "1"
rand = "0.8.3"
fxhash = "0"
partitions = { git = "https://github.com/bluenote-1577/partitions.git", default-features = false, features = ["compact"] }
#partitions = "0.2"
num-traits = "0"
needletail = { version = "0.5", default-features = false }
log = "0.4"
rayon = "1.5"
smallvec = { version = "1", features = ["union","serde","write"] }
serde = "1"
bincode = "1"
intervallum = "1"
rust-lapper = "1"
gcollections = "1"
fastrand="1"
gbdt = "0"
serde_json = "1"
statrs = "0"
memmap2 = "0.9"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen-rayon = "1.2"

[dependencies.clap]
version = "3"
features = ["derive"]
optional = true

[target.'cfg(target_env = "musl")'.dependencies]
tikv-jemallocator = "0.5.4"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_cmd = "1.0.1"
predicates = "1"
serial_test = "0"
tsv = "0.1.1"
reflection = "0"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
simple-logging = "2"

[features]
default = ["cli"]
cli = ["clap"]

[[bin]]
name = "skani"
path = "src/main.rs"
required-features = ["cli"]


[profile.release]
panic = "abort"
lto = true

[profile.dev]
#opt-level = 1
opt-level = 3

#[rust]
#debuginfo-level = 1

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
instant = { version = "0.1", features = ["wasm-bindgen"] }